spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:items_dam_db}
    username: ${DB_USER:items_admin}
    password: ${DB_PASSWORD:secret_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Prototype: update bootstraps the schema on first run against an empty
      # database. Managed deployments should use validate + version-controlled
      # migrations (Flyway/Liquibase) per Section 3.3.1 before production use.
      ddl-auto: update
    show-sql: false

dam:
  storage:
    upload-dir: ${STORAGE_ROOT:/var/dam/assets}
    thumbnail-dir: ${STORAGE_ROOT:/var/dam/thumbnails}
    preview-dir: ${STORAGE_ROOT:/var/dam/previews}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 86400000
